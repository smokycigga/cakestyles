<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d2141" />
    <meta
      name="description"
      content="Cakestyles — handcrafted 100% eggless cakes, brownies, cheesecakes and desserts. Order online for pickup or delivery."
    />
    <title>Cakestyles — Handcrafted Cakes & Bakes</title>

    <!-- Fonts are self-hosted and bundled into the app's CSS (see
         scripts/fetch-fonts.py). They used to come from fonts.googleapis.com,
         which cost two extra origins and a render-blocking stylesheet:
         measured at ~1.6s before first paint on a throttled 4G phone. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/poppins-normal-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-normal-400-900.woff2" crossorigin />

    <script>
      // The hero film — and therefore its 46KB poster — only exists on the
      // homepage. A plain <link rel="preload"> in this file applied to every
      // route, so the product and order pages were fetching a picture they
      // never show, at high priority, ahead of their own JavaScript.
      if (location.pathname === "/") {
        var poster = document.createElement("link");
        poster.rel = "preload";
        poster.as = "image";
        poster.type = "image/webp";
        poster.href = "/images/gallery/hero-poster.webp";
        poster.setAttribute("fetchpriority", "high");
        document.head.appendChild(poster);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Razorpay's checkout script used to be a blocking <script> here, which
         cost every visitor a third-party DNS lookup and download even though
         only the checkout page ever needs it. It is loaded on demand now. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
