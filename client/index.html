<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6d2141" />
    <meta
      name="description"
      content="Cakestyles — handcrafted 100% eggless cakes, brownies, cheesecakes and desserts. Order online for pickup or delivery."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Cakestyles — Handcrafted Cakes & Bakes</title>
    <!-- The hero poster is the largest thing painted on the first screen, so it
         is fetched alongside the stylesheet rather than after the JS parses. -->
    <link rel="preload" as="image" type="image/webp" href="/images/gallery/hero-poster.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Razorpay's checkout script used to be a blocking <script> here, which
         cost every visitor a third-party DNS lookup and download even though
         only the checkout page ever needs it. It is loaded on demand now. -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
